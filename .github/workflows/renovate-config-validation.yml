name: Renovate config validation

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  validate-config:
    name: Validate Renovate configurations
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Validate Renovate presets
        uses: rinchsan/renovate-config-validator@v0.2.1
        with:
          pattern: '*.json'
      - name: Validate repository Renovate configuration
        uses: rinchsan/renovate-config-validator@v0.2.1
        with:
          pattern: '.github/renovate.json'
